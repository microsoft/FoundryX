<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1380" viewBox="0 0 1440 1380" role="img" aria-labelledby="title description">
  <title id="title">FoundryX permissions by layer</title>
  <desc id="description">Nested boxes list tenant consent roles and delegated permissions, all 15 subscription Access management Actions, Foundry account reads, native project reads and Toolbox data access, and the Consumer, User, Manager, and Owner project grants. The dashed FoundryX ACL box is application access, not an Azure resource or inherited Azure role.</desc>
  <style>
    text { font-family: "Segoe UI", Arial, sans-serif; fill: #172b4d; }
    .title { font-size: 32px; font-weight: 700; }
    .heading { font-size: 26px; font-weight: 700; }
    .body { font-size: 21px; }
    .action { font-family: Consolas, monospace; font-size: 17px; }
    .role { font-size: 23px; font-weight: 700; fill: #49308b; }
    .capability { font-size: 20px; }
  </style>
  <rect width="1440" height="1380" fill="#ffffff"/>
  <text x="28" y="46" class="title">FoundryX permissions by layer</text>

  <rect x="28" y="76" width="1384" height="1244" rx="14" fill="#f3f7fd" stroke="#2864a5" stroke-width="2"/>
  <text x="52" y="114" class="heading">Microsoft Entra tenant</text>
  <text x="52" y="150" class="body">Consent role: Application Administrator / Cloud Application Administrator / AI Administrator</text>
  <text x="52" y="180" class="body">or Privileged Role Administrator / Global Administrator / qualifying custom consent role</text>
  <text x="52" y="214" class="body">Graph: User.ReadBasic.All + GroupMember.Read.All</text>
  <text x="52" y="244" class="body">ARM + Foundry: user_impersonation / FoundryX API: access_as_user</text>
  <text x="52" y="274" class="body">Tenant activation + sign-in allowed by Entra policy</text>

  <rect x="52" y="302" width="1336" height="994" rx="12" fill="#edf6fa" stroke="#1b7189" stroke-width="2"/>
  <text x="76" y="340" class="heading">Azure subscription - all 15 Access management Actions</text>
  <text x="76" y="374" class="body">Owner / Contributor + User Access Administrator / custom roles with these Actions</text>
  <text x="76" y="414" class="action">Microsoft.Resources/subscriptions/read</text>
  <text x="76" y="444" class="action">Microsoft.Authorization/permissions/read</text>
  <text x="76" y="474" class="action">Microsoft.Authorization/roleDefinitions/read</text>
  <text x="76" y="504" class="action">Microsoft.Authorization/roleDefinitions/write</text>
  <text x="76" y="534" class="action">Microsoft.Authorization/roleAssignments/read</text>
  <text x="76" y="564" class="action">Microsoft.Authorization/roleAssignments/write</text>
  <text x="76" y="594" class="action">Microsoft.Authorization/roleAssignments/delete</text>
  <text x="76" y="624" class="action">Microsoft.CognitiveServices/accounts/read</text>
  <text x="730" y="414" class="action">Microsoft.CognitiveServices/accounts/projects/read</text>
  <text x="730" y="444" class="action">Microsoft.CognitiveServices/accounts/deployments/read</text>
  <text x="730" y="474" class="action">Microsoft.CognitiveServices/accounts/projects/connections/read</text>
  <text x="730" y="504" class="action">Microsoft.Insights/components/read</text>
  <text x="730" y="534" class="action">Microsoft.OperationalInsights/workspaces/read</text>
  <text x="730" y="564" class="action">Microsoft.Authorization/policyAssignments/read</text>
  <text x="730" y="594" class="action">Microsoft.Authorization/policyExemptions/read</text>

  <rect x="76" y="650" width="1288" height="622" rx="12" fill="#ffffff" stroke="#66809d" stroke-width="2"/>
  <text x="100" y="690" class="heading">Resource group / Foundry account</text>
  <text x="100" y="730" class="action">Microsoft.CognitiveServices/accounts/read</text>
  <text x="100" y="760" class="action">Microsoft.CognitiveServices/accounts/deployments/read</text>

  <rect x="100" y="790" width="1240" height="458" rx="10" fill="#eef8f3" stroke="#247653" stroke-width="2"/>
  <text x="124" y="830" class="heading">Native Foundry project</text>
  <text x="124" y="870" class="action">Microsoft.CognitiveServices/accounts/projects/read</text>
  <text x="124" y="900" class="action">Microsoft.CognitiveServices/accounts/projects/connections/read</text>
  <text x="124" y="936" class="body">Toolboxes: native data read (Azure Foundry User is sufficient)</text>

  <rect x="124" y="964" width="1192" height="260" rx="10" fill="#f5f0ff" stroke="#7853b3" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="148" y="1002" class="heading">FoundryX project ACL - assigned in Grant access, not Azure RBAC</text>
  <rect x="148" y="1024" width="266" height="176" rx="8" fill="#e9ddfa"/>
  <rect x="432" y="1024" width="266" height="176" rx="8" fill="#e9ddfa"/>
  <rect x="716" y="1024" width="266" height="176" rx="8" fill="#e9ddfa"/>
  <rect x="1000" y="1024" width="292" height="176" rx="8" fill="#e9ddfa"/>
  <text x="168" y="1058" class="role">Consumer</text>
  <text x="168" y="1096" class="capability">Use allowed models</text>
  <text x="168" y="1126" class="capability">Invoke deployed agents</text>
  <text x="452" y="1058" class="role">User</text>
  <text x="452" y="1096" class="capability">Consumer +</text>
  <text x="452" y="1126" class="capability">Build / deploy / evaluate</text>
  <text x="452" y="1156" class="capability">Publish / reuse tools</text>
  <text x="736" y="1058" class="role">Manager</text>
  <text x="736" y="1096" class="capability">User +</text>
  <text x="736" y="1126" class="capability">Manage User grants</text>
  <text x="736" y="1156" class="capability">Individuals/groups only</text>
  <text x="1020" y="1058" class="role">Owner</text>
  <text x="1020" y="1096" class="capability">User + manage all grants</text>
  <text x="1020" y="1126" class="capability">Allowed models/tools</text>
  <text x="1020" y="1156" class="capability">Connections / Toolboxes</text>

  <text x="28" y="1358" class="body">Solid: tenant/Azure scopes. Dashed: FoundryX ACL. Project policy applies to every FoundryX role.</text>
</svg>
